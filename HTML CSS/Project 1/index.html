<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="player">

        <img
            src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500"
            class="cover"
            id="cover"
            alt="Album Cover"
        >

        <h2 id="song-title">Banku Bhaiya</h2>
        <p id="artist">John Legend</p>

        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100"
        >

        <div class="controls">
            <button id="prev">⏮</button>
            <button id="play" class="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div class="volume-container">
            🔊
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.1"
                value="1"
            >
        </div>

    </div>

    <div class="playlist">
        <h3>Playlist</h3>

        <ul id="playlist">
            <li data-index="0">Chaap Tilak</li>
            <li data-index="1">Just_A_Boy</li>
            <li data-index="2">STFU</li>
            <li data-index="3">Tu Meri</li>
        </ul>
    </div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>

</body>
</html>

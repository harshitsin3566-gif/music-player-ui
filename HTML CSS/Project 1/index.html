<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="player">
        <img src="https://via.placeholder.com/300" class="cover">

        <h2>Blinding </h2>
        <p>The Weeknd</p>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <div class="controls">
            <button>⏮</button>
            <button class="play">▶</button>
            <button>⏭</button>
        </div>
    </div>

    <div class="playlist">
        <h3>Playlist</h3>
        <ul>
            <li>All of me</li>
            <li>Death Bed</li>
            <li>Perfect</li>
            <li>Somewhere Only we know</li>
        </ul>
    </div>

</div>

</body>
</html>
